runtime: python311
entrypoint: gunicorn app.main:app -w 4 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:$PORT
instance_class: F4_1G
automatic_scaling:
  min_instances: 1
  max_instances: 10
  target_cpu_utilization: 0.7
env_variables:
  ENVIRONMENT: "production"
  DEBUG: "false"
  LOG_LEVEL: "info"
handlers:
  - url: /static
    static_dir: frontend/
    secure: always
  - url: /.*
    script: auto
    secure: always
