# ============================================
# ESH.TRADE - ULTIMATE COMBINED fly.toml
# High Performance + Development + Ultra Advanced
# ============================================

# ============ APP INFO ============
app = "eshtrade"
primary_region = "iad"

# ============ BUILD ============
[build]
  dockerfile = "Dockerfile"
  strategy = "rolling"
  # Development: use this for hot reload
  # strategy = "immediate"

# ============ ENVIRONMENT ============
[env]
  # Core App
  PORT = "8080"
  ENVIRONMENT = "production"  # Change to "development" for dev
  DEBUG = "false"  # Change to "true" for dev
  APP_NAME = "ESH.TRADE"
  APP_VERSION = "4.0.0"
  LOG_LEVEL = "info"  # Change to "debug" for dev
  
  # Database
  DATABASE_URL = "postgresql://eshtrade:password@eshtrade-postgres.internal:5432/eshtrade"
  DATABASE_POOL_SIZE = "50"
  DATABASE_TIMEOUT = "30"
  DATABASE_MAX_OVERFLOW = "20"
  DATABASE_POOL_RECYCLE = "1800"
  
  # Redis
  REDIS_ENABLED = "true"
  REDIS_HOST = "eshtrade-redis.internal"
  REDIS_PORT = "6379"
  REDIS_DB = "0"
  REDIS_MAX_CONNECTIONS = "100"
  
  # WebSocket
  WEBSOCKET_ENABLED = "true"
  WEBSOCKET_PORT = "8001"
  MAX_WS_CONNECTIONS = "100000"
  WS_HEARTBEAT = "15"
  
  # Cache
  CACHE_ENABLED = "true"
  CACHE_TTL = "30"
  CACHE_MAX_SIZE = "100000"
  CACHE_STRATEGY = "lfu"
  
  # Admin
  ADMIN_USERNAME = "admin123"
  ADMIN_PASSWORD = "eSmwas@2004"
  ADMIN_EMAIL = "estradingmachine@gmail.com"
  
  # Email
  GMAIL_USER = "estradingmachine@gmail.com"
  EMAIL_PROVIDER = "gmail"
  EMAIL_RETRY_ATTEMPTS = "3"
  
  # Security
  SECURITY_MASTER_KEY = "esh_trade_master_key_2026"
  JWT_SECRET = "esh_trade_jwt_secret_2026"
  JWT_ALGORITHM = "HS512"
  ACCESS_TOKEN_EXPIRE_MINUTES = "10"
  REFRESH_TOKEN_EXPIRE_DAYS = "14"
  
  # Trading
  MIN_CAPITAL = "5"
  MAX_CAPITAL = "50000000"
  MAX_LEVERAGE = "50"
  MAX_POSITIONS = "100"
  MAX_DAILY_TRADES = "10000"
  
  # Bots
  ENABLE_FOREX = "true"
  ENABLE_CRYPTO = "true"
  ENABLE_STOCKS = "true"
  ENABLE_METALS = "true"
  ENABLE_COMMODITIES = "true"
  BOT_UPDATE_INTERVAL = "0.5"
  
  # Rate Limiting
  RATE_LIMIT_DEFAULT = "500"
  RATE_LIMIT_LOGIN = "20"
  RATE_LIMIT_ADMIN = "200"
  RATE_LIMIT_API = "1000"
  RATE_LIMIT_WINDOW = "60"
  
  # Data Providers
  ALPHA_VANTAGE_API_KEY = ""
  POLYGON_API_KEY = ""
  FINNHUB_API_KEY = ""
  
  # AI
  OPENAI_API_KEY = ""
  GEMINI_API_KEY = ""
  AI_MODEL = "gpt-4"
  
  # Monitoring
  MONITORING_ENABLED = "true"
  METRICS_PORT = "9090"
  HEALTH_CHECK_INTERVAL = "10"

# ============ DEPLOY ============
[deploy]
  release_command = "python -m backend.app.main"
  strategy = "rolling"
  max_unavailable = 0
  min_ready_seconds = 10

# ============ HTTP SERVICE ============
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 3  # Production: 3, Development: 1
  max_machines_running = 20  # Production: 20, Development: 2
  processes = ["app"]
  
  [http_service.concurrency]
    type = "connections"
    hard_limit = 5000
    soft_limit = 4000
  
  [http_service.http_options]
    h2_backend = true
    request_timeout = "30s"
    idle_timeout = "120s"
    response_buffering = true

# ============ VM CONFIGURATION ============
# Production: performance-2x
# Development: shared-cpu-1x
[[vm]]
  size = "performance-2x"
  memory = "4gb"
  cpu_kind = "performance"
  cpus = 2

# ============ HEALTH CHECKS ============
[checks]
  [checks.health]
    type = "http"
    port = 8080
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    restart_limit = 3
    
  [checks.readiness]
    type = "http"
    port = 8080
    path = "/api/v1/status"
    interval = "30s"
    timeout = "10s"
    grace_period = "15s"
    
  [checks.database]
    type = "http"
    port = 8080
    path = "/health"
    interval = "60s"
    timeout = "10s"
    grace_period = "20s"
    
  [checks.redis]
    type = "http"
    port = 8080
    path = "/api/v1/status"
    interval = "60s"
    timeout = "10s"
    grace_period = "20s"

# ============ STATIC FILES ============
[[statics]]
  guest_path = "/app/frontend"
  url_prefix = "/static"

# ============ SERVICES ============
[[services]]
  protocol = "tcp"
  internal_port = 8001
  processes = ["app"]
  
  [[services.ports]]
    port = 8001
    handlers = ["tls"]
    
  [[services.ports]]
    port = 8002
    handlers = ["tls", "http"]

# ============ MOUNTS ============
[mounts]
  source = "eshtrade_data"
  destination = "/app/data"
  initial_size = "50gb"
  
[mounts.backup]
  source = "eshtrade_backups"
  destination = "/app/backups"
  initial_size = "100gb"

# ============ METRICS ============
[metrics]
  port = 9090
  path = "/metrics"

# ============ PROCESSES ============
[processes]
  app = "uvicorn backend.app.main:app --host 0.0.0.0 --port 8080 --workers 8 --loop uvloop --http httptools"
  worker = "python -m backend.app.worker --workers 4"
  scheduler = "python -m backend.app.scheduler --interval 30"
  monitor = "python -m backend.app.monitor --interval 10"

# ============ KILL TIMEOUT ============
[kill_timeout]
  app = "30s"
  worker = "60s"
  scheduler = "15s"
  monitor = "10s"

# ============ AUTO-SCALING ============
[auto_scaling]
  enabled = true
  min_machines = 3
  max_machines = 20
  
  [auto_scaling.cpu]
    enabled = true
    threshold = 0.7
    scale_up = 2
    scale_down = 1
    
  [auto_scaling.memory]
    enabled = true
    threshold = 0.8
    scale_up = 2
    scale_down = 1
    
  [auto_scaling.connections]
    enabled = true
    threshold = 4000
    scale_up = 3
    scale_down = 1
    
  [auto_scaling.error_rate]
    enabled = true
    threshold = 5
    scale_up = 1
    scale_down = 0

# ============ BACKUP ============
[backup]
  enabled = true
  schedule = "0 2 * * *"
  retention = 30
  destination = "s3://eshtrade-backups"
  
  [backup.database]
    enabled = true
    schedule = "0 * * * *"  # Hourly
    retention = 24
    
  [backup.files]
    enabled = true
    schedule = "0 0 * * *"  # Daily
    retention = 7

# ============ ALERTS ============
[alerts]
  [alerts.cpu]
    enabled = true
    threshold = 90
    action = "scale_up"
    notify = true
    
  [alerts.memory]
    enabled = true
    threshold = 90
    action = "restart"
    notify = true
    
  [alerts.disk]
    enabled = true
    threshold = 80
    action = "notify"
    notify = true
    
  [alerts.error_rate]
    enabled = true
    threshold = 5
    action = "notify"
    notify = true
    
  [alerts.cost]
    enabled = true
    threshold = 100  # $100/month
    action = "notify"
    notify = true

# ============ NETWORK ============
[network]
  [network.proxy]
    enabled = true
    protocol = "tcp"
    
  [network.private]
    enabled = true

# ============ LOGGING ============
[logging]
  level = "info"  # "debug" for development
  format = "json"
  
  [logging.files]
    app = "/app/data/logs/app.log"
    access = "/app/data/logs/access.log"
    error = "/app/data/logs/error.log"
    security = "/app/data/logs/security.log"

# ============ SECURITY ============
[security]
  [security.headers]
    enabled = true
    hsts = true
    x_frame_options = "DENY"
    x_content_type_options = "nosniff"
    referrer_policy = "strict-origin-when-cross-origin"
    
  [security.cors]
    enabled = true
    origins = ["https://eshtrade.com", "https://app.eshtrade.com"]
    methods = ["GET", "POST", "PUT", "DELETE", "PATCH"]
    headers = ["Authorization", "Content-Type"]

# ============ ENVIRONMENTS ============
[environments]
  [environments.development]
    min_machines = 1
    max_machines = 2
    vm_size = "shared-cpu-1x"
    memory = "512mb"
    debug = true
    log_level = "debug"
    
  [environments.staging]
    min_machines = 1
    max_machines = 3
    vm_size = "shared-cpu-2x"
    memory = "1gb"
    debug = false
    log_level = "info"
    
  [environments.production]
    min_machines = 3
    max_machines = 20
    vm_size = "performance-2x"
    memory = "4gb"
    debug = false
    log_level = "info"