# Fly.io Configuration for ESMH.TRADE
# Deploy with: flyctl deploy --config fly.toml

app = "esmh-trade"
primary_region = "iad"  # Change to your preferred region: lax, fra, nrt, etc.

[build]
  dockerfile = "Dockerfile.prod"

[env]
  APP_NAME = "ESMH.TRADE"
  DEBUG = "false"
  LOG_LEVEL = "INFO"
  DATABASE_URL = "sqlite:///./data/estrade.db"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "5s"
    method = "GET"
    path = "/health"
    protocol = "http"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

# Uncomment for persistent storage (SQLite)
# [mounts]
#   source = "esmh_data"
#   destination = "/app/data"

# Uncomment for PostgreSQL (recommended for production)
# [postgres]
#   vm_size = "shared-cpu-1x"
#   disk_size_gb = 10
