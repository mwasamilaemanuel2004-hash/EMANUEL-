name: esmh-trade
region: nyc
services:
  - name: backend
    source_dir: /
    github:
      repo: mwasamilaemanuel2004-hash/EMANUEL-
      branch: main
      deploy_on_push: true
    run_command: gunicorn app.main:app -w 4 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8080
    environment_slug: python
    instance_count: 2
    instance_size_slug: professional-xs
    health_check:
      http_path: /health
      port: 8080
    http_port: 8080
    envs:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: ${db.DATABASE_URL}
      - key: SECRET_KEY
        generate: true
databases:
  - name: db
    engine: PG
    version: "16"
