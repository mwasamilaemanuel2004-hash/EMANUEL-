# Docker Compose for Production
# Usage: docker compose -f docker-compose.prod.yml up -d

version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: esmh-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://esmh:${DB_PASSWORD}@postgres:5432/estrade
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=${SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SMTP_SERVER=${SMTP_SERVER:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_SECRET_KEY=${BINANCE_SECRET_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DEBUG=false
    volumes:
      - esmh_data:/app/data
      - esmh_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - esmh-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    container_name: esmh-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=esmh
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=estrade
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - esmh-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esmh"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: esmh-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - esmh-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: esmh-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - api
    networks:
      - esmh-network

  # Optional: Celery worker for background tasks
  celery:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: esmh-celery
    restart: unless-stopped
    command: celery -A backend.app.scheduler.tasks worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://esmh:${DB_PASSWORD}@postgres:5432/estrade
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
    networks:
      - esmh-network

  # Optional: Celery beat for scheduled tasks
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: esmh-celery-beat
    restart: unless-stopped
    command: celery -A backend.app.scheduler.tasks beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://esmh:${DB_PASSWORD}@postgres:5432/estrade
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
    networks:
      - esmh-network

volumes:
  postgres_data:
  redis_data:
  esmh_data:
  esmh_logs:
  certbot_conf:
  certbot_www:

networks:
  esmh-network:
    driver: bridge
